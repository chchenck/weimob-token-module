name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest runner 预装了完整 Android SDK（ANDROID_HOME 已就绪），无需 setup-android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 把 Xposed API stub 源码编译成独立 jar，app 以 compileOnly files() 引用。
      # stub 类绝不进入 APK，否则 LSPosed 拒绝加载模块。
      - name: Build Xposed API stub jar
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" >/dev/null 2>&1 || true
          PLATFORM="$ANDROID_HOME/platforms/android-34"
          echo "using platform: $PLATFORM"
          test -f "$PLATFORM/android.jar" || { echo "android.jar missing"; ls -R "$ANDROID_HOME/platforms" || true; exit 1; }
          mkdir -p app/libs stub_build
          javac -classpath "$PLATFORM/android.jar" -d stub_build $(find xposed-stub/src -name '*.java')
          jar -cf app/libs/xposed-api-stub.jar -C stub_build de
          unzip -l app/libs/xposed-api-stub.jar

      - name: Build
        run: |
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # 终极防线：APK 里若检出 Xposed API 类即构建失败，杜绝 LSPosed 拒载
      - name: Verify APK does not bundle Xposed API classes
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          if unzip -p "$APK" classes.dex | grep -q "de/robv/android/xposed"; then
            echo "::error::APK bundles Xposed API classes! LSPosed will refuse to load it."
            exit 1
          fi
          echo "APK is clean: no bundled Xposed API classes."

      - name: Report errors to annotations
        if: failure()
        run: |
          grep -E "error:|error |FAILURE:|Caused by:" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line:0:500}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weimob-token-sniffer-debug
          path: app/build/outputs/apk/debug/*.apk
