plugins {
    id 'com.android.library'
}

android {
    namespace 'de.robv.android.xposed'
    compileSdk 34

    defaultConfig {
        minSdk 23
    }
}

// Xposed API stub：仅供编译期符号引用。
// app 模块以 compileOnly project(':xposed-stub') 引用，
// stub 类不会进入 APK，运行时由 LSPosed 注入真实实现。
// 注意：绝不能把 Xposed API 类打进 APK，否则 LSPosed 拒绝加载模块。
