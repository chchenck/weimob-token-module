plugins {
    id 'com.android.application'
}

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.mao.weimobtoken'
    compileSdk 34

    defaultConfig {
        applicationId "com.mao.weimobtoken"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Xposed API 必须 compileOnly：CI 在构建前把 xposed-stub/ 源码 javac 成
// app/libs/xposed-api-stub.jar，此处以 files() 引用（最经典可靠的方式）。
// 若 API 类被编译进 APK，LSPosed 会拒绝加载模块
//（"The Xposed API classes are compiled into the module's APK"），hook 完全不生效。
dependencies {
    compileOnly files('libs/xposed-api-stub.jar')
}
