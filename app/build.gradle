plugins {
    id 'com.android.application'
}

repositories {
    google()
    mavenCentral()
}

android {
    namespace 'com.mao.weimobtoken'
    compileSdk 34

    defaultConfig {
        applicationId "com.mao.weimobtoken"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Xposed API 必须 compileOnly：只参与编译、不打入 APK。
// 若 API 类被编译进 APK，LSPosed 会拒绝加载模块（"The Xposed API classes
// are compiled into the module's APK"），hook 完全不生效。
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
